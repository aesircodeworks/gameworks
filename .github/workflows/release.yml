name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          version=$(awk '/^version:/{gsub(/["\047]/,"",$2); print $2; exit}' distribution.yaml)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version in distribution.yaml: ${version:-<empty>}"
            exit 1
          fi
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1 && gh release view "$tag" >/dev/null 2>&1; then
            echo "Tag and GitHub Release ${tag} already exist"
            exit 0
          fi
          title=$(awk -v ver="$version" '
            $0 ~ "^## " ver " " { sub(/^## /, ""); print; exit }
          ' CHANGELOG.md)
          if [ -z "$title" ]; then
            echo "No CHANGELOG.md heading for ${version}"
            exit 1
          fi
          notes=$(awk -v ver="$version" '
            $0 ~ "^## " ver " " { found=1; next }
            found && /^## / { exit }
            found {
              if (!started) {
                if ($0 ~ /^[[:space:]]*$/) next
                started=1
              }
              buf = buf $0 ORS
            }
            END {
              sub(/[\n\r]+$/, "", buf)
              print buf
            }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "No CHANGELOG.md bullets for ${version}"
            exit 1
          fi
          if ! git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "$title"
            git push origin "refs/tags/${tag}"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes_file="$(mktemp)"
            printf '%s\n' "$notes" > "$notes_file"
            gh release create "$tag" --title "$title" --notes-file "$notes_file" --target "$GITHUB_SHA"
          fi
